<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071423"/><stop offset="1" stop-color="#21123b"/></linearGradient><marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker><marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c084fc"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><g opacity=".09" stroke="#fff"><path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600"/><path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g><text x="90" y="105" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" fill="#e2e8f0" font-weight="760">The next AI race is not “who owns more GPUs?”</text><text x="90" y="150" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#94a3b8">It is “how does the next dollar of AI capex return to the business?”</text><path d="M80 700 C260 620 290 300 690 300" fill="none" stroke="#38bdf8" stroke-width="65" stroke-linecap="round" opacity=".28"/><path d="M80 700 C260 620 290 300 690 300" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-dasharray="22 18" marker-end="url(#arrowB)"/><circle cx="150" cy="660" r="45" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="3"/><text x="150" y="667" font-family="Arial" font-size="16" fill="#e0f2fe" font-weight="700" text-anchor="middle">Compute</text><circle cx="280" cy="560" r="45" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="3"/><text x="280" y="567" font-family="Arial" font-size="16" fill="#e0f2fe" font-weight="700" text-anchor="middle">Platform</text><circle cx="400" cy="430" r="45" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="3"/><text x="400" y="437" font-family="Arial" font-size="16" fill="#e0f2fe" font-weight="700" text-anchor="middle">Workflow</text><circle cx="600" cy="315" r="45" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="3"/><text x="600" y="322" font-family="Arial" font-size="16" fill="#e0f2fe" font-weight="700" text-anchor="middle">Revenue</text><path d="M910 680 C1040 630 1080 520 1190 455 C1300 390 1400 365 1515 330" fill="none" stroke="#c084fc" stroke-width="65" stroke-linecap="round" opacity=".24"/><path d="M910 680 C1040 630 1080 520 1190 455 C1300 390 1400 365 1515 330" fill="none" stroke="#d8b4fe" stroke-width="5" stroke-dasharray="14 18" marker-end="url(#arrowP)"/><circle cx="930" cy="680" r="48" fill="#4c1d95" stroke="#d8b4fe" stroke-width="3"/><text x="930" y="687" font-family="Arial" font-size="15" fill="#faf5ff" font-weight="700" text-anchor="middle">Core cash</text><circle cx="1110" cy="530" r="48" fill="#4c1d95" stroke="#d8b4fe" stroke-width="3"/><text x="1110" y="537" font-family="Arial" font-size="15" fill="#faf5ff" font-weight="700" text-anchor="middle">Infrastructure</text><circle cx="1290" cy="420" r="48" fill="#4c1d95" stroke="#d8b4fe" stroke-width="3"/><text x="1290" y="427" font-family="Arial" font-size="15" fill="#faf5ff" font-weight="700" text-anchor="middle">New products</text><circle cx="1490" cy="335" r="48" fill="#4c1d95" stroke="#d8b4fe" stroke-width="3"/><text x="1490" y="342" font-family="Arial" font-size="15" fill="#faf5ff" font-weight="700" text-anchor="middle">?</text><rect x="650" y="515" width="300" height="175" rx="28" fill="#0f172a" stroke="#a5b4fc"/><g fill="#1e293b" stroke="#818cf8"><rect x="685" y="555" width="48" height="40" rx="7"/><rect x="748" y="555" width="48" height="40" rx="7"/><rect x="811" y="555" width="48" height="40" rx="7"/><rect x="874" y="555" width="48" height="40" rx="7"/><rect x="685" y="610" width="48" height="40" rx="7"/><rect x="748" y="610" width="48" height="40" rx="7"/><rect x="811" y="610" width="48" height="40" rx="7"/><rect x="874" y="610" width="48" height="40" rx="7"/></g><text x="800" y="735" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#cbd5e1" font-weight="650" text-anchor="middle">Infrastructure is only the middle of the story</text><rect x="220" y="790" width="1160" height="62" rx="31" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="800" y="830" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#e2e8f0" font-weight="650" text-anchor="middle">The competitive advantage is a visible, durable path from capex → product → pricing → cash flow.</text></svg>